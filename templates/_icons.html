{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'trophy' %}<path d="M8 3h8v6a4 4 0 0 1-8 0V3Z M8 5H4v2a4 4 0 0 0 4 4 M16 5h4v2a4 4 0 0 1-4 4 M12 13v5 M8 21h8 M9 18h6v3H9Z"/>
{% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
{% elif name == 'home' %}<path d="m3 10 9-7 9 7 M5 9v12h5v-7h4v7h5V9"/>
{% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
{% elif name == 'history' %}<path d="M3 11a9 9 0 1 1 2 7 M3 4v7h7 M12 7v5l3 2"/>
{% elif name == 'arrow' %}<path d="M4 12h16 M14 6l6 6-6 6"/>
{% elif name == 'back' %}<path d="M20 12H4 M10 6l-6 6 6 6"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'close' %}<path d="m6 6 12 12 M18 6 6 18"/>
{% elif name == 'logout' %}<path d="M9 4H4v16h5 M10 12h11 M17 8l4 4-4 4"/>
{% elif name == 'star' %}<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>
{% elif name == 'chart' %}<path d="M4 3v18h17 M8 16v-4 M13 16V8 M18 16V5"/>
{% elif name == 'book' %}<path d="M12 5v16 M3 4c4-1 6-1 9 1 3-2 5-2 9-1v15c-4-1-6-1-9 2-3-3-5-3-9-2V4Z"/>
{% elif name == 'code' %}<path d="m8 7-5 5 5 5 M16 7l5 5-5 5 M14 4l-4 16"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3 M12 14v3"/>
{% elif name == 'spark' %}<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'moon' %}<path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1.5 1.5 M17.5 17.5 19 19 M5 19l1.5-1.5 M17.5 6.5 19 5"/>
{% endif %}
</svg>
{%- endmacro %}
