{% extends "base.html" %}

{% block title %}Регистрация - Olympiad Platform{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h1 style="text-align: center; margin-bottom: 30px;">📝 Регистрация</h1>
    
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" class="form-control" required minlength="6">
            <small style="color: #666;">Минимум 6 символов</small>
        </div>
        
        <button type="submit" class="btn btn-success" style="width: 100%;">Зарегистрироваться</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px; color: #666;">
        Уже есть аккаунт? <a href="{{ url_for('login') }}" style="color: #667eea;">Войти</a>
    </div>
</div>
{% endblock %}
