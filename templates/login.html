{% extends "base.html" %}
{% block title %}Вход — Olympiad Platform{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h1 style="text-align: center; margin-bottom: 30px;">🔐 Вход</h1>
    {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label for="username">Логин</label>
            <input id="username" name="username" class="form-control" maxlength="128" autocomplete="username" required autofocus value="{{ request.form.get('username', '') }}"></div>
        <div class="form-group"><label for="password">Пароль</label>
            <input type="password" id="password" name="password" class="form-control" maxlength="128" autocomplete="current-password" required></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
    </form>
    <p style="text-align: center; margin-top: 20px;">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
</div>
{% endblock %}
