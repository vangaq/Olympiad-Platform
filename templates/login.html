{% extends "_auth.html" %}
{% block title %}Вход — Olympiad Platform{% endblock %}
{% block auth_form %}
<h2>С возвращением!</h2>
<p class="auth-intro">Войди, чтобы продолжить с того места, где остановился.</p>
{% if error %}<div class="flash flash-error" role="alert">{{ icon('close', 18) }}<span>{{ error }}</span></div>{% endif %}
<form method="POST" action="{{ url_for('login') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label for="username">Логин</label><input id="username" name="username" class="form-control" maxlength="128" autocomplete="username" placeholder="Логин" required autofocus value="{{ request.form.get('username', '') }}"></div>
    <div class="form-group"><label for="password">Пароль</label><input type="password" id="password" name="password" class="form-control" maxlength="128" autocomplete="current-password" placeholder="Пароль" required></div>
    <button type="submit" class="btn btn-primary auth-submit">Войти {{ icon('arrow', 18) }}</button>
</form>
<p class="auth-switch">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
{% endblock %}
