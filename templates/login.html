{% extends "base.html" %}

{% block title %}Вход - Olympiad Platform{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h1 style="text-align: center; margin-bottom: 30px;">🔐 Вход</h1>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px; color: #666;">
        Еще нет аккаунта? <a href="{{ url_for('register') }}" style="color: #667eea;">Зарегистрироваться</a>
    </div>
    
    <div style="margin-top: 30px; padding: 15px; background: #f8f9fa; border-radius: 10px; font-size: 14px;">
        <strong>🔑 Демо-доступ:</strong><br>
        Администратор: <code>admin</code> / <code>admin123</code>
    </div>
</div>
{% endblock %}
