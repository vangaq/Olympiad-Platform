[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olympiad-training-platform"
version = "1.0.0"
description = "Olympiad training platform with server-side answer checking"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.4",
    "itsdangerous==2.2.0",
    "click==8.5.0",
    "blinker==1.9.0",
    "waitress==3.0.2",
]

[tool.setuptools]
packages = ["olympiad"]
py-modules = ["check_python"]
